# Push side: fetch new NSE filings, prices and fundamentals, classify, enrich, commit the JSON the app reads.
name: refresh
on:
  schedule:
    - cron: "*/30 3-12 * * 1-5"   # every 30 min, 08:30-18:00 IST on weekdays
    - cron: "30 14 * * *"          # once each evening (end-of-day prices, weekend filings)
  workflow_dispatch:
concurrency: { group: data-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Build
        env: { LLM_BASE_URL: "${{ secrets.LLM_BASE_URL }}", LLM_API_KEY: "${{ secrets.LLM_API_KEY }}", PYTHONUTF8: "1" }
        run: python pipeline/build.py --days 90 --enrich-days 45
      - name: Commit
        run: |
          git config user.name "finn-bot"; git config user.email "finn-bot@users.noreply.github.com"
          git add web/public/data data/cache
          git diff --cached --quiet || (git commit -m "data: refresh $(date -u +%FT%TZ)" && git pull --rebase && git push)
